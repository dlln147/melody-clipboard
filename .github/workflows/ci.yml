name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies (from lockfile)
        run: npm ci

      - name: Frontend formatting check
        run: npm run format:check

      - name: Frontend lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm run test

      - name: Version consistency check
        run: npm run version:check

      - name: Frontend production build
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust formatting check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Compiles the Tauri binary against the built frontend without
      # producing platform installers, to validate the full build pipeline
      # on every push/PR. Signed, bundled release builds happen only in
      # release.yml, on version tags.
      - name: Tauri build validation (no bundling)
        run: npm run tauri build -- --debug --no-bundle
