name: Bug report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much
        of this as you can — it makes the issue much faster to fix.

  - type: input
    id: version
    attributes:
      label: Melody Clipboard version
      description: Help → About, or the filename of the installer you downloaded
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows x64
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste this JSON: ...
        2. Set tonic to ...
        3. Click Export MIDI
        4. See error
    validations:
      required: true

  - type: textarea
    id: sample-json
    attributes:
      label: Sample melody JSON (if relevant)
      description: >
        If the bug involves parsing or conversion, please paste a small,
        sanitized JSON sample that reproduces it. Remove anything you don't
        want to share publicly — a minimal 1-2 note example is usually enough.
      render: json

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Screenshots, error text shown in the app, etc.
